<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 610" role="img" aria-label="Schéma des données GestiFormation au jour 3 : Inscription, lien Client-User, Groupes et Permissions">
  <rect width="1080" height="610" fill="#ffffff"/>
  <text x="540" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#1f2937">Schéma des données — jour 3 : Inscription, comptes, groupes et permissions</text>

  <!-- relations -->
  <g stroke-width="2" fill="none">
    <line x1="250" y1="115" x2="350" y2="115" stroke="#4f46e5"/>
    <line x1="465" y1="190" x2="465" y2="290" stroke="#0f766e"/>
    <line x1="250" y1="365" x2="350" y2="365" stroke="#0f766e"/>
    <line x1="145" y1="440" x2="145" y2="490" stroke="#0f766e"/>
    <line x1="250" y1="530" x2="350" y2="530" stroke="#64748b"/>
    <line x1="580" y1="530" x2="700" y2="530" stroke="#64748b"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#475569">
    <text x="300" y="106" text-anchor="middle">1 — N</text>
    <text x="480" y="245">1 — N</text>
    <text x="300" y="356" text-anchor="middle">1 — N</text>
    <text x="160" y="470">1 — 1</text>
    <text x="300" y="521" text-anchor="middle">N — M</text>
    <text x="640" y="521" text-anchor="middle">N — M</text>
  </g>

  <g font-family="system-ui, sans-serif">
    <!-- Formation -->
    <rect x="40" y="60" width="210" height="110" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
    <path d="M40,68 a8,8 0 0 1 8,-8 h194 a8,8 0 0 1 8,8 v18 h-210 z" fill="#4f46e5"/>
    <text x="145" y="78" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Formation</text>
    <g font-size="11" fill="#475569">
      <text x="54" y="106">code · nom · public</text>
      <text x="54" y="124">duree · prix · nouveaute</text>
      <text x="54" y="142">competences  (M2M)</text>
    </g>

    <!-- Intervention -->
    <rect x="350" y="60" width="230" height="130" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
    <path d="M350,68 a8,8 0 0 1 8,-8 h214 a8,8 0 0 1 8,8 v18 h-230 z" fill="#4f46e5"/>
    <text x="465" y="78" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Intervention</text>
    <g font-size="11" fill="#475569">
      <text x="364" y="106">formation  (FK, CASCADE)</text>
      <text x="364" y="124">numero · statut A / E / C</text>
      <text x="364" y="142">date_debut · date_fin · ville</text>
      <text x="364" y="160">capacite · nb_inscrits</text>
      <text x="364" y="178" fill="#0f766e">nb_inscrits : maintenu par services.py</text>
    </g>

    <!-- Client -->
    <rect x="40" y="290" width="210" height="150" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
    <path d="M40,298 a8,8 0 0 1 8,-8 h194 a8,8 0 0 1 8,8 v18 h-210 z" fill="#4f46e5"/>
    <text x="145" y="308" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Client</text>
    <g font-size="11" fill="#475569">
      <text x="54" y="336">prenom · nom · societe</text>
      <text x="54" y="354">email  (unique)</text>
      <text x="54" y="372">telephone · date_creation</text>
    </g>
    <rect x="48" y="388" width="194" height="42" rx="5" fill="#f0fdfa" stroke="#0f766e" stroke-dasharray="4 3"/>
    <text x="56" y="406" font-size="11" fill="#0f766e" font-weight="600">+ utilisateur  (1-1, SET_NULL)</text>
    <text x="56" y="422" font-size="10.5" fill="#0f766e">migration 0003 · nouveau J3</text>

    <!-- Inscription -->
    <rect x="350" y="290" width="230" height="170" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
    <path d="M350,298 a8,8 0 0 1 8,-8 h214 a8,8 0 0 1 8,8 v18 h-230 z" fill="#0f766e"/>
    <text x="465" y="308" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Inscription  — nouveau J3</text>
    <g font-size="11" fill="#475569">
      <text x="364" y="336">client  (FK, PROTECT)</text>
      <text x="364" y="354">intervention  (FK, PROTECT)</text>
      <text x="364" y="372">statut  P · C · X</text>
      <text x="364" y="390">montant_ht · date_inscription</text>
      <text x="364" y="414" fill="#0f766e">UNIQUE (client, intervention)</text>
      <text x="364" y="430" fill="#0f766e">   si statut ≠ annulée</text>
      <text x="364" y="448" fill="#0f766e">perm. annuler_inscription</text>
    </g>

    <!-- User -->
    <rect x="40" y="490" width="210" height="85" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
    <path d="M40,498 a8,8 0 0 1 8,-8 h194 a8,8 0 0 1 8,8 v18 h-210 z" fill="#64748b"/>
    <text x="145" y="508" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">auth.User</text>
    <g font-size="11" fill="#475569">
      <text x="54" y="536">username · password (hash)</text>
      <text x="54" y="554">is_staff · is_superuser</text>
    </g>

    <!-- Group -->
    <rect x="350" y="490" width="230" height="85" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
    <path d="M350,498 a8,8 0 0 1 8,-8 h214 a8,8 0 0 1 8,8 v18 h-230 z" fill="#64748b"/>
    <text x="465" y="508" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">auth.Group</text>
    <g font-size="11" fill="#475569">
      <text x="364" y="536">name : Formateurs,</text>
      <text x="364" y="554">Gestionnaires</text>
    </g>

    <!-- Permission -->
    <rect x="700" y="490" width="300" height="85" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
    <path d="M700,498 a8,8 0 0 1 8,-8 h284 a8,8 0 0 1 8,8 v18 h-300 z" fill="#64748b"/>
    <text x="850" y="508" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">auth.Permission</text>
    <g font-size="11" fill="#475569">
      <text x="714" y="536">codename : add_ · change_ · delete_ · view_</text>
      <text x="714" y="554">+ annuler_inscription  (personnalisée)</text>
    </g>

    <!-- note J2 -->
    <text x="700" y="100" font-size="11.5" fill="#6b7280">Contrat (hérite de Document) et Competence :</text>
    <text x="700" y="118" font-size="11.5" fill="#6b7280">inchangés depuis le jour 2.</text>

    <!-- légende -->
    <g font-size="11.5" fill="#475569">
      <rect x="700" y="290" width="16" height="16" rx="3" fill="#eef2ff" stroke="#4f46e5"/>
      <text x="724" y="303">jour 2 (inchangé)</text>
      <rect x="700" y="318" width="16" height="16" rx="3" fill="#f0fdfa" stroke="#0f766e"/>
      <text x="724" y="331">nouveau jour 3</text>
      <rect x="700" y="346" width="16" height="16" rx="3" fill="#f8fafc" stroke="#64748b"/>
      <text x="724" y="359">fourni par django.contrib.auth</text>
    </g>
  </g>
</svg>
