<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 390" role="img" aria-label="ModelForm : du modèle au formulaire, validation puis save()">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0f766e"/>
    </marker>
    <marker id="arr-err" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#d97706"/>
    </marker>
  </defs>
  <rect width="1080" height="390" fill="#ffffff"/>
  <text x="540" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#1f2937">ModelForm — le formulaire se déduit du modèle (une seule source de vérité)</text>

  <!-- modèle -->
  <g font-family="system-ui, sans-serif">
    <rect x="40" y="80" width="210" height="180" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="145" y="106" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">models.Client</text>
    <g font-size="11" fill="#475569">
      <text x="56" y="134">prenom · nom · societe  (CharField)</text>
      <text x="56" y="154">email  (EmailField, unique)</text>
      <text x="56" y="174">telephone  (max_length=20)</text>
      <text x="56" y="194">date_creation  (auto_now_add)</text>
    </g>
    <text x="56" y="226" font-size="11" fill="#b91c1c">utilisateur  (OneToOne) — hors formulaire</text>
    <text x="56" y="244" font-size="10.5" fill="#6b7280">jamais exposé : liste blanche Meta.fields</text>
  </g>

  <!-- ModelForm -->
  <g font-family="system-ui, sans-serif">
    <rect x="310" y="80" width="230" height="180" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="425" y="106" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">ClientForm(ModelForm)</text>
    <g font-size="11" fill="#475569">
      <text x="326" y="134">class Meta:</text>
      <text x="342" y="152">model = Client</text>
      <text x="342" y="170">fields = [5 champs]</text>
      <text x="342" y="188">error_messages = …</text>
      <text x="326" y="214">clean_telephone()</text>
      <text x="326" y="232">clean_email()   (normalise)</text>
    </g>
  </g>

  <!-- validation -->
  <g font-family="system-ui, sans-serif">
    <rect x="600" y="80" width="200" height="180" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="700" y="106" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">is_valid()</text>
    <g font-size="11" fill="#475569">
      <text x="616" y="134">1. type + contraintes du champ</text>
      <text x="616" y="156">2. clean_&lt;champ&gt;()</text>
      <text x="616" y="178">3. clean()</text>
      <text x="616" y="200">4. validate_unique()</text>
    </g>
    <text x="616" y="232" font-size="10.5" fill="#6b7280">l'instance éditée est ignorée</text>
    <text x="616" y="248" font-size="10.5" fill="#6b7280">par le contrôle d'unicité</text>
  </g>

  <!-- save -->
  <g font-family="system-ui, sans-serif">
    <rect x="860" y="60" width="190" height="90" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
    <text x="955" y="90" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">form.save()</text>
    <text x="955" y="112" text-anchor="middle" font-size="11" fill="#6b7280">INSERT  (sans instance)</text>
    <text x="955" y="130" text-anchor="middle" font-size="11" fill="#6b7280">UPDATE  (instance=client)</text>
  </g>
  <!-- erreurs -->
  <g font-family="system-ui, sans-serif">
    <rect x="860" y="190" width="190" height="90" rx="10" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
    <text x="955" y="220" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">form.errors</text>
    <text x="955" y="242" text-anchor="middle" font-size="11" fill="#6b7280">gabarit re-rendu, re-rempli</text>
    <text x="955" y="260" text-anchor="middle" font-size="11" fill="#6b7280">rien n'est écrit en base</text>
  </g>

  <!-- flèches -->
  <line x1="252" y1="170" x2="308" y2="170" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="542" y1="170" x2="598" y2="170" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="802" y1="140" x2="858" y2="110" stroke="#0f766e" stroke-width="2" marker-end="url(#arr-ok)"/>
  <line x1="802" y1="200" x2="858" y2="230" stroke="#d97706" stroke-width="2" marker-end="url(#arr-err)"/>

  <g font-family="system-ui, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">
    <text x="281" y="158">génère</text>
    <text x="281" y="190">champs + widgets</text>
    <text x="571" y="158">POST</text>
    <text x="571" y="190">+ instance=</text>
    <text x="837" y="112" fill="#0f766e">True</text>
    <text x="837" y="238" fill="#d97706">False</text>
  </g>

  <!-- bandeau -->
  <g font-family="system-ui, sans-serif" font-size="12" fill="#475569">
    <rect x="40" y="305" width="1010" height="62" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="56" y="328"><tspan font-weight="600">Création</tspan> : ClientForm(request.POST)          <tspan font-weight="600">Édition</tspan> : ClientForm(request.POST, instance=client)          <tspan font-weight="600">Vierge</tspan> : ClientForm()</text>
    <text x="56" y="350">Libellés, max_length, required, EmailField et unicité sont repris du modèle — plus aucun champ à recopier.</text>
  </g>
</svg>
