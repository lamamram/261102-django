<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" role="img" aria-label="Schéma des données GestiFormation : 4 tables et une classe abstraite">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <marker id="arr-m2m" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4f46e5"/>
    </marker>
  </defs>
  <rect width="1080" height="640" fill="#ffffff"/>
  <text x="540" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#1f2937">Schéma des données — GestiFormation (jour 2)</text>
  <text x="540" y="54" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" fill="#6b7280">4 tables en base + 1 classe abstraite · relations déclarées dans models.py</text>

  <!-- flèches -->
  <g stroke="#475569" stroke-width="2" fill="none">
    <!-- Formation → Intervention (1-N) -->
    <line x1="540" y1="290" x2="540" y2="435" marker-end="url(#arr)"/>
    <!-- Client → Document/Contrat (1-N) -->
    <line x1="885" y1="290" x2="885" y2="415" marker-end="url(#arr)"/>
    <!-- Document → Contrat (héritage) -->
    <line x1="885" y1="495" x2="885" y2="535" marker-end="url(#arr)"/>
  </g>
  <!-- Competence ↔ Formation (N-M, les deux sens) -->
  <g stroke="#4f46e5" stroke-width="2" fill="none">
    <line x1="320" y1="195" x2="415" y2="195" marker-end="url(#arr-m2m)"/>
    <line x1="415" y1="225" x2="320" y2="225" marker-end="url(#arr-m2m)"/>
  </g>

  <!-- libellés des relations -->
  <g font-family="system-ui, sans-serif" font-size="12" fill="#334155">
    <text x="367" y="180" text-anchor="middle" font-weight="600" fill="#4f46e5">N — M</text>
    <text x="367" y="250" text-anchor="middle" font-size="11" fill="#6b7280">table intermédiaire</text>
    <text x="367" y="264" text-anchor="middle" font-size="11" fill="#6b7280">formation_competences</text>
    <text x="552" y="360" text-anchor="start" font-weight="600">1 — N</text>
    <text x="552" y="376" text-anchor="start" font-size="11" fill="#6b7280">ForeignKey · on_delete=CASCADE</text>
    <text x="552" y="390" text-anchor="start" font-size="11" fill="#6b7280">related_name='interventions'</text>
    <text x="897" y="352" text-anchor="start" font-weight="600">1 — N</text>
    <text x="897" y="368" text-anchor="start" font-size="11" fill="#6b7280">ForeignKey · on_delete=PROTECT</text>
    <text x="897" y="382" text-anchor="start" font-size="11" fill="#6b7280">related_name='contrats'</text>
    <text x="897" y="518" text-anchor="start" font-size="11" fill="#6b7280">héritage abstrait</text>
  </g>

  <!-- Competence -->
  <g>
    <rect x="70" y="140" width="250" height="150" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
    <text x="195" y="166" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#1f2937">Competence</text>
    <g font-family="system-ui, sans-serif" font-size="11.5" fill="#334155">
      <text x="195" y="190" text-anchor="middle">nom <tspan fill="#6b7280">(unique)</tspan></text>
      <text x="195" y="208" text-anchor="middle">description <tspan fill="#6b7280">(blank)</tspan></text>
    </g>
    <text x="195" y="272" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#6b7280">catalog_competence</text>
  </g>

  <!-- Formation -->
  <g>
    <rect x="415" y="140" width="250" height="150" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="540" y="166" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#1f2937">Formation</text>
    <g font-family="system-ui, sans-serif" font-size="11.5" fill="#334155">
      <text x="540" y="190" text-anchor="middle">code <tspan fill="#6b7280">(unique)</tspan> · nom · public · duree</text>
      <text x="540" y="208" text-anchor="middle">prix <tspan fill="#6b7280">Decimal</tspan> · nouveaute</text>
      <text x="540" y="226" text-anchor="middle">competences <tspan fill="#4f46e5" font-weight="600">M2M</tspan> · date_creation</text>
    </g>
    <text x="540" y="272" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#6b7280">catalog_formation</text>
  </g>

  <!-- Client -->
  <g>
    <rect x="760" y="140" width="250" height="150" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
    <text x="885" y="166" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#1f2937">Client</text>
    <g font-family="system-ui, sans-serif" font-size="11.5" fill="#334155">
      <text x="885" y="190" text-anchor="middle">prenom · nom</text>
      <text x="885" y="208" text-anchor="middle">societe <tspan fill="#6b7280">(blank)</tspan> · email <tspan fill="#6b7280">(unique)</tspan></text>
      <text x="885" y="226" text-anchor="middle">telephone · date_creation</text>
    </g>
    <text x="885" y="272" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#6b7280">catalog_client</text>
  </g>

  <!-- Intervention -->
  <g>
    <rect x="415" y="440" width="250" height="150" rx="10" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
    <text x="540" y="466" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#1f2937">Intervention</text>
    <g font-family="system-ui, sans-serif" font-size="11.5" fill="#334155">
      <text x="540" y="490" text-anchor="middle">formation_id <tspan fill="#d97706" font-weight="600">FK</tspan> · numero <tspan fill="#6b7280">(unique)</tspan></text>
      <text x="540" y="508" text-anchor="middle">date_debut · date_fin · ville</text>
      <text x="540" y="526" text-anchor="middle">capacite · nb_inscrits · statut</text>
    </g>
    <text x="540" y="572" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#6b7280">catalog_intervention</text>
  </g>

  <!-- Document (abstrait) -->
  <g>
    <rect x="760" y="420" width="250" height="70" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="885" y="447" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#475569">Document — abstract</text>
    <text x="885" y="468" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" fill="#6b7280">titre · numero · date_creation · commentaire</text>
  </g>
  <text x="885" y="412" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#6b7280">pas de table, pas de manager</text>

  <!-- Contrat -->
  <g>
    <rect x="760" y="540" width="250" height="90" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
    <text x="885" y="565" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#1f2937">Contrat</text>
    <g font-family="system-ui, sans-serif" font-size="11.5" fill="#334155">
      <text x="885" y="588" text-anchor="middle">client_id <tspan fill="#0f766e" font-weight="600">FK</tspan> · montant_ht · date_signature</text>
      <text x="885" y="606" text-anchor="middle" fill="#6b7280">+ les 4 champs hérités</text>
    </g>
  </g>
  <text x="885" y="632" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#6b7280">catalog_contrat</text>

  <!-- légende bas -->
  <text x="70" y="620" font-family="system-ui, sans-serif" font-size="11.5" fill="#6b7280">Client ↔ Intervention : non modélisé volontairement → le modèle « Inscription » du jour 3.</text>
</svg>
