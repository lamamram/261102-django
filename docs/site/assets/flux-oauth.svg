<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 600" role="img" aria-label="Flux OAuth 2.0 Authorization Code : le navigateur, GestiFormation avec allauth, et le fournisseur GitHub ou Google, en dix étapes">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0f766e"/>
    </marker>
  </defs>
  <rect width="1080" height="600" fill="#ffffff"/>
  <text x="540" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#1f2937">Connexion sociale — OAuth 2.0, flux « Authorization Code »</text>

  <!-- bande back-channel -->
  <rect x="525" y="322" width="410" height="132" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="535" y="446" font-family="system-ui, sans-serif" font-size="10.5" font-style="italic" fill="#0f766e">canal serveur ↔ serveur : le client_secret ne passe jamais par le navigateur</text>

  <!-- en-têtes et lignes de vie -->
  <g font-family="system-ui, sans-serif">
    <rect x="80" y="52" width="180" height="46" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
    <text x="170" y="72" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Navigateur</text>
    <text x="170" y="88" text-anchor="middle" font-size="10.5" fill="#475569">l'utilisateur</text>

    <rect x="430" y="52" width="220" height="46" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="540" y="72" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">GestiFormation</text>
    <text x="540" y="88" text-anchor="middle" font-size="10.5" fill="#475569">Django + django-allauth</text>

    <rect x="800" y="52" width="220" height="46" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
    <text x="910" y="72" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Fournisseur</text>
    <text x="910" y="88" text-anchor="middle" font-size="10.5" fill="#475569">GitHub · Google</text>
  </g>
  <g stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5">
    <line x1="170" y1="98" x2="170" y2="575"/>
    <line x1="540" y1="98" x2="540" y2="575"/>
    <line x1="910" y1="98" x2="910" y2="575"/>
  </g>

  <!-- messages -->
  <g stroke="#475569" stroke-width="2" fill="none">
    <line x1="170" y1="132" x2="538" y2="132" marker-end="url(#arr)"/>
    <line x1="538" y1="170" x2="172" y2="170" marker-end="url(#arr)"/>
    <line x1="172" y1="208" x2="908" y2="208" marker-end="url(#arr)"/>
    <line x1="908" y1="246" x2="172" y2="246" marker-end="url(#arr)"/>
    <line x1="172" y1="284" x2="538" y2="284" marker-end="url(#arr)"/>
    <line x1="542" y1="340" x2="908" y2="340" marker-end="url(#arr-ok)" stroke="#0f766e"/>
    <line x1="908" y1="372" x2="542" y2="372" marker-end="url(#arr-ok)" stroke="#0f766e" stroke-dasharray="6 4"/>
    <line x1="542" y1="404" x2="908" y2="404" marker-end="url(#arr-ok)" stroke="#0f766e"/>
    <line x1="908" y1="426" x2="542" y2="426" marker-end="url(#arr-ok)" stroke="#0f766e" stroke-dasharray="6 4"/>
    <line x1="538" y1="540" x2="172" y2="540" marker-end="url(#arr)"/>
  </g>

  <g font-family="system-ui, sans-serif" font-size="11.5" fill="#1f2937" text-anchor="middle">
    <text x="354" y="124"><tspan font-weight="600">①</tspan> POST /accounts/github/login/ (jeton CSRF)</text>
    <text x="354" y="162"><tspan font-weight="600">②</tspan> 302 vers le fournisseur · state mémorisé en session</text>
    <text x="540" y="200"><tspan font-weight="600">③</tspan> GET …/authorize?client_id&amp;scope&amp;state — connexion et consentement chez le fournisseur</text>
    <text x="540" y="238"><tspan font-weight="600">④</tspan> 302 vers /accounts/github/login/callback/?code=…&amp;state=…</text>
    <text x="354" y="276"><tspan font-weight="600">⑤</tspan> GET callback : code + state</text>
    <text x="725" y="332" fill="#0f766e"><tspan font-weight="600">⑥</tspan> POST /access_token (code + secret)</text>
    <text x="725" y="364" fill="#0f766e"><tspan font-weight="600">⑦</tspan> access_token</text>
    <text x="725" y="396" fill="#0f766e"><tspan font-weight="600">⑧</tspan> GET /user (Bearer)</text>
    <text x="725" y="420" fill="#0f766e" font-size="10.5">profil : e-mail, nom</text>
    <text x="354" y="532"><tspan font-weight="600">⑩</tspan> 302 → /fr/mon-espace/ + cookie de session</text>
  </g>

  <!-- étape 9 : traitement local -->
  <g font-family="system-ui, sans-serif">
    <rect x="300" y="466" width="480" height="52" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="316" y="487" font-size="12" font-weight="600" fill="#1f2937">⑨ Vérifier le state · retrouver ou créer le compte local</text>
    <text x="316" y="505" font-size="11" fill="#475569">signal user_signed_up → services.rattacher_client(user) → login()</text>
  </g>

  <text x="540" y="580" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" fill="#6b7280">Enregistrer chez le fournisseur l'URL de retour exacte : https://…/accounts/github/login/callback/ — hors préfixe de langue.</text>
</svg>
