<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 420" role="img" aria-label="Pyramide des tests de GestiFormation : tests unitaires, d'intégration et de bout en bout">
  <rect width="1080" height="420" fill="#ffffff"/>
  <text x="540" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#1f2937">Ce qu'on teste, à quelle échelle — la suite de GestiFormation (74 tests)</text>

  <!-- pyramide -->
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <polygon points="300,70 360,70 400,140 260,140" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
    <text x="330" y="100" font-size="12" font-weight="600" fill="#1f2937">Bout en bout</text>
    <text x="330" y="118" font-size="10.5" fill="#6b7280">0 test</text>

    <polygon points="260,148 400,148 470,258 190,258" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
    <text x="330" y="188" font-size="13" font-weight="600" fill="#1f2937">Intégration</text>
    <text x="330" y="208" font-size="11" fill="#475569">vues · permissions</text>
    <text x="330" y="224" font-size="11" fill="#475569">admin · langues</text>
    <text x="330" y="244" font-size="12" font-weight="600" fill="#0f766e">49 tests</text>

    <polygon points="190,266 470,266 540,376 120,376" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="330" y="304" font-size="13" font-weight="600" fill="#1f2937">Unitaires</text>
    <text x="330" y="324" font-size="11" fill="#475569">services · formulaires · modèles</text>
    <text x="330" y="344" font-size="11" fill="#475569">règles métier, sans HTTP</text>
    <text x="330" y="364" font-size="12" font-weight="600" fill="#4f46e5">25 tests</text>
  </g>

  <!-- légende à droite -->
  <g font-family="system-ui, sans-serif" font-size="12" fill="#475569">
    <text x="600" y="95" font-weight="600" fill="#b45309">Bout en bout — navigateur réel</text>
    <text x="600" y="113">Selenium, Playwright, LiveServerTestCase.</text>
    <text x="600" y="129">Lents et fragiles : quelques parcours critiques.</text>
    <text x="600" y="145" fill="#6b7280">Hors périmètre de la formation.</text>

    <text x="600" y="195" font-weight="600" fill="#0f766e">Intégration — self.client</text>
    <text x="600" y="213">Le trajet complet requête → réponse, sans réseau :</text>
    <text x="600" y="229">gardes d'accès, redirections, messages, gabarits.</text>
    <text x="600" y="245" fill="#6b7280">La majorité des tests d'une application Django.</text>

    <text x="600" y="295" font-weight="600" fill="#4f46e5">Unitaires — la logique pure</text>
    <text x="600" y="313">inscrire(), annuler(), clean_*, places_dispo.</text>
    <text x="600" y="329">Rapides, précis : un échec désigne la fonction fautive.</text>
    <text x="600" y="345" fill="#6b7280">SimpleTestCase si aucune base n'est nécessaire.</text>
  </g>

  <text x="540" y="405" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" fill="#6b7280">Les vues restent minces parce que la logique est dans services.py : c'est ce qui rend la base de la pyramide testable sans HTTP.</text>
</svg>
