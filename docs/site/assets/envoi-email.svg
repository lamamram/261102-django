<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 470" role="img" aria-label="Envoi d'un e-mail de confirmation : la vue appelle le service, le callback on_commit part après le COMMIT, emails.py rend texte et HTML puis confie le message au backend choisi par EMAIL_BACKEND">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0f766e"/>
    </marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#b45309"/>
    </marker>
  </defs>
  <rect width="1080" height="470" fill="#ffffff"/>
  <text x="540" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#1f2937">Un e-mail part après le COMMIT, dans la langue de la requête, par le backend de l'environnement</text>

  <g font-family="system-ui, sans-serif">
    <!-- rangée 1 : le trajet nominal -->
    <rect x="30" y="70" width="160" height="100" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="46" y="94" font-size="13" font-weight="600" fill="#1f2937">1 · La vue</text>
    <text x="46" y="114" font-size="11" fill="#475569">nouvelle_inscription</text>
    <text x="46" y="131" font-size="11" fill="#475569">sinscrire</text>
    <text x="46" y="153" font-size="11" fill="#475569">appelle le service</text>

    <rect x="225" y="70" width="215" height="100" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
    <text x="241" y="94" font-size="13" font-weight="600" fill="#1f2937">2 · services.inscrire()</text>
    <text x="241" y="114" font-size="11" fill="#475569">@transaction.atomic</text>
    <text x="241" y="131" font-size="11" fill="#475569">règles, UPDATE F(), INSERT</text>
    <text x="241" y="153" font-size="11" fill="#0f766e" font-weight="600">transaction.on_commit(callback)</text>

    <rect x="475" y="70" width="125" height="100" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
    <text x="491" y="94" font-size="13" font-weight="600" fill="#1f2937">3 · COMMIT</text>
    <text x="491" y="114" font-size="11" fill="#475569">les données</text>
    <text x="491" y="131" font-size="11" fill="#475569">sont durables</text>
    <text x="491" y="153" font-size="11" fill="#0f766e" font-weight="600">le callback part</text>

    <rect x="635" y="70" width="235" height="100" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="651" y="94" font-size="13" font-weight="600" fill="#1f2937">4 · emails.confirmation_inscription</text>
    <text x="651" y="114" font-size="11" fill="#475569">translation.override(langue)</text>
    <text x="651" y="131" font-size="11" fill="#475569">render_to_string(.txt) + (.html)</text>
    <text x="651" y="153" font-size="11" fill="#475569">EmailMultiAlternatives.send()</text>

    <rect x="905" y="70" width="145" height="100" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
    <text x="921" y="94" font-size="13" font-weight="600" fill="#1f2937">5 · Backend</text>
    <text x="921" y="114" font-size="11" fill="#475569">choisi par</text>
    <text x="921" y="131" font-size="11" fill="#475569">EMAIL_BACKEND</text>
    <text x="921" y="153" font-size="11" fill="#475569">(variable d'env.)</text>
  </g>
  <g stroke="#475569" stroke-width="2">
    <line x1="190" y1="120" x2="223" y2="120" marker-end="url(#arr)"/>
    <line x1="440" y1="120" x2="473" y2="120" marker-end="url(#arr)"/>
    <line x1="600" y1="120" x2="633" y2="120" marker-end="url(#arr-ok)" stroke="#0f766e"/>
    <line x1="870" y1="120" x2="903" y2="120" marker-end="url(#arr)"/>
  </g>

  <!-- rangée 2 : annulation par rollback / les trois backends -->
  <g font-family="system-ui, sans-serif">
    <rect x="30" y="215" width="570" height="85" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/>
    <text x="46" y="239" font-size="13" font-weight="600" fill="#1f2937">Règle refusée → ROLLBACK</text>
    <text x="46" y="259" font-size="11" fill="#475569">DejaInscrit · InterventionComplete : l'exception annule la transaction,</text>
    <text x="46" y="276" font-size="11" fill="#475569">le callback enregistré n'est jamais exécuté.</text>
    <text x="46" y="293" font-size="11" fill="#b45309" font-weight="600">Aucune place prise, aucun e-mail : jamais de confirmation d'une inscription fantôme.</text>

    <rect x="640" y="215" width="130" height="80" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
    <text x="652" y="238" font-size="12.5" font-weight="600" fill="#1f2937">console</text>
    <text x="652" y="257" font-size="10.5" fill="#475569">développement</text>
    <text x="652" y="274" font-size="10.5" fill="#475569">affiché dans le</text>
    <text x="652" y="288" font-size="10.5" fill="#475569">terminal</text>

    <rect x="780" y="215" width="130" height="80" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="792" y="238" font-size="12.5" font-weight="600" fill="#1f2937">smtp</text>
    <text x="792" y="257" font-size="10.5" fill="#475569">production</text>
    <text x="792" y="274" font-size="10.5" fill="#475569">EMAIL_HOST, PORT,</text>
    <text x="792" y="288" font-size="10.5" fill="#475569">USE_TLS, identifiants</text>

    <rect x="920" y="215" width="130" height="80" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
    <text x="932" y="238" font-size="12.5" font-weight="600" fill="#1f2937">locmem</text>
    <text x="932" y="257" font-size="10.5" fill="#475569">tests (automatique)</text>
    <text x="932" y="274" font-size="10.5" fill="#475569">liste mail.outbox,</text>
    <text x="932" y="288" font-size="10.5" fill="#475569">aucun réseau</text>
  </g>
  <g stroke="#475569" stroke-width="2" fill="none">
    <line x1="330" y1="171" x2="330" y2="213" stroke="#b45309" stroke-dasharray="5 4" marker-end="url(#arr-warn)"/>
    <path d="M977,171 L977,193 L705,193 L705,213" marker-end="url(#arr)"/>
    <line x1="845" y1="193" x2="845" y2="213" marker-end="url(#arr)"/>
    <line x1="985" y1="193" x2="985" y2="213" marker-end="url(#arr)"/>
  </g>
  <text x="340" y="196" font-family="system-ui, sans-serif" font-size="11" fill="#b45309">exception</text>

  <!-- rangée 3 : configuration et panne SMTP -->
  <g font-family="system-ui, sans-serif">
    <rect x="30" y="335" width="570" height="95" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
    <text x="46" y="358" font-size="13" font-weight="600" fill="#1f2937">Configuration — settings.py lit l'environnement (.env)</text>
    <g font-size="11" fill="#475569">
      <text x="46" y="379">EMAIL_BACKEND · EMAIL_HOST · EMAIL_PORT · EMAIL_USE_TLS · EMAIL_TIMEOUT = 10</text>
      <text x="46" y="397">DEFAULT_FROM_EMAIL (expéditeur)  ·  SITE_URL (liens absolus : pas de request)</text>
      <text x="46" y="415">le code d'envoi ne change jamais : seul l'environnement change</text>
    </g>

    <rect x="640" y="335" width="410" height="95" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/>
    <text x="656" y="358" font-size="13" font-weight="600" fill="#1f2937">Panne du serveur SMTP</text>
    <g font-size="11" fill="#475569">
      <text x="656" y="379">SMTPException / OSError → logger.exception(...)</text>
      <text x="656" y="397">la fonction retourne False ; la requête ne plante pas</text>
      <text x="656" y="415" fill="#b45309" font-weight="600">l'inscription, déjà validée, est conservée</text>
    </g>
  </g>
  <line x1="845" y1="296" x2="845" y2="333" stroke="#b45309" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr-warn)"/>

  <text x="540" y="458" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" fill="#6b7280">Dans un TestCase, la transaction n'est jamais validée : captureOnCommitCallbacks(execute=True) exécute les callbacks pour que mail.outbox se remplisse.</text>
</svg>
