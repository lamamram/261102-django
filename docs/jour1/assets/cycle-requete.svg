<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 560" role="img" aria-label="Cycle de vie d'une requête Django">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <marker id="arr-retour" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4f46e5"/>
    </marker>
  </defs>
  <rect width="740" height="560" fill="#ffffff"/>
  <text x="370" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#1f2937">Cycle de vie d'une requête — `manage.py runserver`</text>

  <!-- navigateur -->
  <rect x="110" y="55" width="180" height="48" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="200" y="84" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#1f2937">Navigateur</text>
  <line x1="200" y1="103" x2="200" y2="122" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- retour -->
  <path d="M172,468 C78,468 58,96 108,84" fill="none" stroke="#4f46e5" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr-retour)"/>
  <text x="46" y="300" transform="rotate(-90 46 300)" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" fill="#4f46e5">Réponse (HTML)</text>

  <!-- épine dorsale -->
  <line x1="200" y1="130" x2="200" y2="468" stroke="#cbd5e1" stroke-width="2"/>

  <!-- étapes -->
  <g font-family="system-ui, sans-serif" font-size="14" fill="#1f2937">
    <g>
      <circle cx="200" cy="145" r="15" fill="#4f46e5"/>
      <text x="200" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">1</text>
      <text x="232" y="150">Le serveur de dev (WSGI) reçoit la requête HTTP : méthode, URL, en-têtes, corps</text>
    </g>
    <g>
      <circle cx="200" cy="210" r="15" fill="#4f46e5"/>
      <text x="200" y="215" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2</text>
      <text x="232" y="215">URLconf : le routeur fait correspondre l'URL à un pattern, puis appelle la vue</text>
    </g>
    <g>
      <circle cx="200" cy="275" r="15" fill="#4f46e5"/>
      <text x="200" y="280" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">3</text>
      <text x="232" y="275">Middlewares « avant vue » : sessions, authentification, CSRF, sécurité…</text>
    </g>
    <g>
      <circle cx="200" cy="340" r="15" fill="#4f46e5"/>
      <text x="200" y="345" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">4</text>
      <text x="232" y="340">La vue exécute la logique et construit le <tspan font-weight="600">contexte</tspan> (données à afficher)</text>
    </g>
    <g>
      <circle cx="200" cy="405" r="15" fill="#4f46e5"/>
      <text x="200" y="410" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">5</text>
      <text x="232" y="405">Le gabarit (template) est rendu avec le contexte → document HTML</text>
    </g>
    <g>
      <circle cx="200" cy="468" r="15" fill="#0f766e"/>
      <text x="200" y="473" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">6</text>
      <text x="232" y="473">Middlewares « après vue » → la réponse part vers le navigateur</text>
    </g>
  </g>
</svg>
